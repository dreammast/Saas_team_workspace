services:
  # Backend Web Service (Spring Boot API)
  - type: web
    name: projectflow-backend
    env: java
    buildCommand: cd SAAS_platform/backend && mvn clean package -DskipTests
    startCommand: java -jar SAAS_platform/backend/target/backend-0.0.1-SNAPSHOT.jar
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: FRONTEND_URL
        value: https://projectflow-frontend.onrender.com

  # Frontend Web Service (Static Site)
  - type: web
    name: projectflow-frontend
    env: static
    buildCommand: cd SAAS_platform/frontend && npm install && npm run build
    publishDir: SAAS_platform/frontend/dist
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          name: projectflow-backend
          type: web
          property: host
