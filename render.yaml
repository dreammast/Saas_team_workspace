    name: projectflow-backend
    env: java
    buildCommand: cd SAAS_platform/backend && mvn clean package -DskipTests
    startCommand: java -jar SAAS_platform/backend/target/backend-0.0.1-SNAPSHOT.jar
    plan: free
    envVars:
